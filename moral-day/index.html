<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도덕이 사라진 하루</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1d2433;--mu:#5d667a;--card:#fff;--bd:#e3e7ef;--ac:#5b5bf0;--ac2:#ff7a59;--ok:#13a06d;--bad:#e5484d;--gold:#f0a800;--bg1:#cfe3ff;--bg2:#f7f9ff}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:16px/1.65 'Noto Sans KR',system-ui,'Malgun Gothic',sans-serif;word-break:keep-all;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
body.dawn{--bg1:#ffd5b0;--bg2:#fff4e6}
body.morning{--bg1:#bfe0ff;--bg2:#f2f8ff}
body.noon{--bg1:#ffeb8f;--bg2:#fffbe8}
body.after{--bg1:#ffc29b;--bg2:#ffefe3}
body.eve{--bg1:#8f7cf0;--bg2:#ffc1d9}
body.night{--bg1:#1c1f52;--bg2:#4a347f}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.wide{max-width:1240px}
h1,h2,h3,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:.2px}
h1{font-size:34px;line-height:1.25;margin:6px 0 10px}
h2{font-size:25px;margin:4px 0 10px}
h3{font-size:19px;margin:14px 0 6px}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;margin-top:16px;box-shadow:0 8px 28px rgba(30,30,80,.12)}
.mu{color:var(--mu)}
.sm{font-size:14px}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;background:var(--ac);color:#fff;transition:transform .12s,box-shadow .12s;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#eef0f7;color:var(--ink)}
.btn.orange{background:var(--ac2)}
.btn.green{background:var(--ok)}
.btn.red{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;color:var(--ink);background:#fff}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ac)}
textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--bd);border-radius:12px;min-height:110px;resize:vertical;color:var(--ink);background:#fff}
.code-in{font-size:30px!important;text-align:center;letter-spacing:10px;font-weight:900}
.logo{font-size:64px;line-height:1;margin-top:12px}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;background:#eef0ff;color:var(--ac);font-weight:700;font-size:13px}
.notice{background:#fff7e0;border:1px solid #f3d27a;color:#6b5000;border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:12px}
.err{background:#ffecec;border:1px solid #f3a3a3;color:#8a1f1f;border-radius:12px;padding:12px 14px;margin-top:12px}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.emos button{font-size:30px;border:2px solid var(--bd);background:#fff;border-radius:14px;min-height:56px;cursor:pointer}
.emos button.on{border-color:var(--ac);background:#eef0ff;transform:scale(1.06)}
/* HUD */
.hud{position:sticky;top:8px;z-index:5;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;background:rgba(255,255,255,.94);color:var(--ink);border-radius:18px;padding:12px 16px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.hud .coin{font-family:'Jua';font-size:26px;white-space:nowrap}
.hud .coin.neg{color:var(--bad)}
.trust{display:flex;align-items:center;gap:8px;font-size:14px}
.trust .bar{flex:1;height:12px;background:#eceef4;border-radius:99px;overflow:hidden}
.trust .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffd166,#3ecf8e);transition:width .6s}
.dots{grid-column:1/-1;display:flex;gap:6px}
.dots i{flex:1;height:7px;border-radius:9px;background:#e3e6ee}
.dots i.now{background:#b9c1ff}
.dots i.red{background:var(--bad)}
.dots i.green{background:var(--ok)}
/* scene */
.scene{position:relative;overflow:hidden}
.clock{display:inline-block;font-family:'Jua';font-size:20px;background:#1d2433;color:#fff;padding:2px 14px;border-radius:10px}
.bigemo{font-size:76px;line-height:1.1;margin:10px 0 2px}
.sit{font-size:18px;margin:8px 0 4px}
.whisper{font-size:14px;color:#8a5cf6;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ch{border:3px solid transparent;border-radius:18px;padding:16px 12px;cursor:pointer;font:inherit;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px;transition:transform .15s}
.ch:hover{transform:translateY(-3px)}
.ch b{font-size:18px}
.ch span{font-size:14px;font-weight:700}
.ch.off{background:#fff0f0;border-color:#ffb3b3}
.ch.off span{color:var(--bad)}
.ch.on{background:#ecfbf4;border-color:#9fe3c4}
.ch.on span{color:var(--ok)}
.ch .ic{font-size:34px}
.result{margin-top:16px;padding:16px;border-radius:16px;animation:pop .35s ease}
.result.r{background:#fff0f0}
.result.g{background:#ecfbf4}
.float{position:absolute;right:24px;top:20px;font-family:'Jua';font-size:34px;animation:up 1.2s ease forwards;pointer-events:none}
.float.p{color:var(--gold)}
.float.m{color:var(--bad)}
@keyframes up{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .4s ease}
.shake{animation:shake .5s ease}
.breaking{background:#e5484d;color:#fff;font-family:'Jua';font-size:20px;padding:6px 14px;border-radius:10px;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.boom{border:4px solid var(--bad)}
.bless{border:4px solid var(--ok)}
.delta{font-family:'Jua';font-size:40px}
.delta.m{color:var(--bad)}
.delta.p{color:var(--ok)}
table.st{width:100%;border-collapse:collapse;margin-top:8px}
table.st td{padding:10px 6px;border-bottom:1px solid var(--bd)}
table.st td:last-child{text-align:right;font-weight:900;font-family:'Jua';font-size:20px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp div{border-radius:14px;padding:14px;text-align:center}
.cmp .a{background:#ecfbf4}
.cmp .b{background:#fff0f0}
.cmp b{display:block;font-family:'Jua';font-size:28px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{border:2px solid var(--bd);background:#fff;border-radius:14px;padding:13px 16px;text-align:left;font:inherit;font-size:16.5px;cursor:pointer;color:var(--ink)}
.opt.on{border-color:var(--ac);background:#eef0ff;box-shadow:0 0 0 2px var(--ac) inset;font-weight:700}
/* s2 */
.stm{border-top:1px dashed var(--bd);padding:16px 0}
.stm:first-of-type{border-top:0}
.stm p{margin:0 0 10px;font-weight:700;font-size:17px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:46px;border:2px solid var(--bd);background:#fff;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.scale button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.scl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);margin-top:3px}
.pred{margin-top:12px;background:#f6f4ff;border-radius:12px;padding:10px 12px}
.pred label{font-size:14.5px;font-weight:700;color:#5a3fd6}
.pred .pv{font-family:'Jua';font-size:24px;color:#5a3fd6;min-width:64px;text-align:right}
input[type=range]{flex:1;accent-color:#6d4cff;height:28px}
.cnt{float:right;font-size:13px;color:var(--mu)}
/* result bars */
.rb{margin:10px 0 16px}
.rb .lab{font-size:15px;font-weight:700;margin-bottom:4px}
.track{position:relative;height:26px;background:#eef0f6;border-radius:8px;overflow:visible}
.track .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#7c8bff,#5b5bf0);transition:width .8s}
.track .guess{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--ac2);border-radius:3px}
.track .guess::after{content:'내 예측';position:absolute;top:-20px;left:-18px;font-size:11px;color:var(--ac2);font-weight:900;white-space:nowrap}
.rb .nums{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:4px}
.fab{position:fixed;right:16px;bottom:18px;z-index:20;animation:pop .4s ease,blink 1.4s 1s infinite}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal .card{max-width:640px;width:100%;margin:0}
.title-card{text-align:center;background:linear-gradient(135deg,#fff,#f1eeff)}
.title-card .t{font-family:'Jua';font-size:34px;color:#5a3fd6}
.title-card .ic{font-size:84px;line-height:1.1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;font-size:15px;animation:pop .3s}
.ft{text-align:center;font-size:12.5px;color:var(--mu);margin-top:26px}
body.night .ft{color:#cfc8ff}
/* teacher */
.thead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.roomcode{font-family:'Jua';font-size:64px;letter-spacing:8px;line-height:1;color:var(--ac)}
#qr{background:#fff;padding:8px;border-radius:12px;display:inline-block}
#qr img,#qr canvas{display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tab{border:0;background:#fff;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tab.on{background:var(--ac);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#f3f4fa;border-radius:999px;padding:6px 12px;font-size:15px}
.chip small{color:var(--mu);margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#f6f7fc;border-radius:14px;padding:14px}
.kpi b{display:block;font-family:'Jua';font-size:34px;color:var(--ac)}
.hb{display:grid;grid-template-columns:minmax(120px,240px) 1fr 70px;gap:10px;align-items:center;margin:8px 0}
.hb .tk{height:24px;background:#eef0f6;border-radius:8px;overflow:hidden}
.hb .tk i{display:block;height:100%;border-radius:8px}
.hb .v{font-weight:900;text-align:right}
.dist{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:end;height:90px;margin-top:6px}
.dist div{background:#c9cffd;border-radius:6px 6px 0 0;position:relative;min-height:2px}
.dist div.hi{background:#5b5bf0}
.dist span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;font-weight:700}
.dlab{display:grid;grid-template-columns:repeat(5,1fr);font-size:12px;text-align:center;color:var(--mu)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note{border-radius:14px;padding:14px;font-size:17px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.08);animation:pop .4s}
.note small{display:block;font-weight:400;color:#555;margin-top:6px;font-size:13px}
.sub{border-bottom:1px solid var(--bd);padding:12px 0}
.sub p{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid2,.thead{grid-template-columns:1fr}.roomcode{font-size:48px}.choices{grid-template-columns:1fr}.hb{grid-template-columns:1fr 1fr 56px}h1{font-size:28px}}
body.big .wide{max-width:1600px}
body.big{font-size:20px}
body.big .hb{grid-template-columns:minmax(160px,360px) 1fr 90px}
</style>

const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const FOOT = '<p class="ft">© 김정환 · M.A.D.T (Moral And Digital Teacher)</p>';
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function setBg(c){ document.body.className = (document.body.classList.contains('big')?'big ':'') + (c||''); }
function animateNum(el, from, to){
  if(!el) return; const st=performance.now(), d=700;
  (function f(n){ const k=Math.min(1,(n-st)/d); const v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    el.textContent='🪙 '+v; el.classList.toggle('neg', v<0); if(k<1) requestAnimationFrame(f); })(st);
}
function copyText(txt){
  const done=()=>toast('복사했어요! 📋');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, fallback); } else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast('복사하지 못했어요. 직접 선택해서 복사해 주세요.'); } ta.remove(); }
}
function baseUrl(){ return location.origin + location.pathname; }
function dbErr(e){ console.error(e); toast('저장 중 문제가 생겼어요. 인터넷 연결을 확인해 주세요.'); }

let S = null, ROOM = '', SOLO = false, REVEAL = null;

function newState(){ return {step:'join', name:'', emo:'', sc:0, s1:[-1,-1,-1,-1,-1], tw:0, who:-1, s2:{v:[0,0,0,0,0], p:[50,50,50,50,50]}, s2done:false, s3:{g:-1, rule:''}, fin:{a:'',b:''}}; }
function sid(){ let id=LS.get('moralday_sid'); if(!id){ id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); LS.set('moralday_sid',id);} return id; }
function save(){
  LS.set('moralday_'+ROOM, S);
  if(!SOLO && ONLINE){
    db.ref('moralday/'+ROOM+'/students/'+sid()).set({
      name:S.name, emo:S.emo, step:S.step, s1:S.s1, who:S.who, s2:S.s2, s2done:S.s2done,
      s3:S.s3, fin:S.fin, ts:firebase.database.ServerValue.TIMESTAMP
    }).catch(dbErr);
  }
}
function go(step){ S.step=step; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

async function studentStart(room){
  ROOM = room; SOLO = room==='SOLO';
  app.className='wrap';
  if(!SOLO){
    if(!ONLINE){ app.innerHTML='<div class="card"><h2>연결할 수 없어요 😢</h2><p>이 사이트는 아직 교사-학생 연동이 설정되지 않았어요. 선생님께 알려 주세요.</p><a class="btn" href="?r=SOLO">혼자 해보기로 하기</a></div>'+FOOT; return; }
    app.innerHTML='<div class="card center"><p>방에 연결하는 중…</p></div>';
    try{
      const m = await db.ref('moralday/'+ROOM+'/meta').once('value');
      if(!m.exists()){ app.innerHTML='<div class="card"><h2>방을 찾을 수 없어요 🔍</h2><p>방 코드 <b>'+esc(ROOM)+'</b>가 맞는지 다시 확인해 주세요.</p><a class="btn" href="'+baseUrl()+'">다시 입력하기</a></div>'+FOOT; return; }
    }catch(e){ app.innerHTML='<div class="card"><h2>연결에 실패했어요</h2><p>인터넷 연결을 확인하고 새로고침해 주세요.</p></div>'+FOOT; return; }
    db.ref('moralday/'+ROOM+'/meta').on('value', snap=>{
      const m=snap.val()||{}; const was=REVEAL && REVEAL.on;
      REVEAL = m.reveal ? {on:true, pct:m.pct||[], n:m.n||0} : null;
      fab();
      if(REVEAL && !was && S && S.s2done) toast('📊 우리 반 예측 결과가 공개됐어요!');
    });
  }
  S = Object.assign(newState(), LS.get('moralday_'+ROOM) || {});
  render();
}

function dayCoins(){ return S.s1.reduce((a,c,i)=>a+(c===1?SCENES[i].off.g:0),0); }
function offCount(){ return S.s1.filter(x=>x===1).length; }
function delta(i){ return S.s1[i]===1 ? -SCENES[i].back.l : SCENES[i].good.b; }
function finalCoins(){ let t=dayCoins(); for(let i=0;i<5;i++) t+=delta(i); return t; }
function hud(coin, cur){
  const tr=100-offCount()*20;
  return `<div class="hud"><div class="coin ${coin<0?'neg':''}" id="coin">🪙 ${coin}</div>
  <div class="trust"><span>🏘️ 마을 신뢰도</span><div class="bar"><i style="width:${tr}%"></i></div><b>${tr}</b></div>
  <div class="dots">${SCENES.map((s,i)=>`<i class="${S.s1[i]===1?'red':S.s1[i]===0?'green':(i===cur?'now':'')}"></i>`).join('')}</div></div>`;
}

function render(){
  fab();
  const st=S.step;
  if(st==='join') return vJoin();
  if(st==='intro') return vIntro();
  if(st==='scene') return vScene();
  if(st==='news') return vNews();
  if(st==='twist') return vTwist();
  if(st==='settle') return vSettle();
  if(st==='s2') return vS2();
  if(st==='s3') return vS3();
  if(st==='final') return vFinal();
  return vDone();
}

function vScene(){
  const i=S.sc, sc=SCENES[i], ans=S.s1[i];
  setBg(sc.bg);
  app.innerHTML = hud(dayCoins(), i) + `<div class="card scene pop" id="sc">
  <div class="row" style="justify-content:space-between"><span class="clock">⏰ ${sc.time}</span><span class="badge">장면 ${i+1} / 5</span></div>
  <div class="bigemo">${sc.emo}</div><h2>${sc.place}</h2>
  <p class="sit">${sc.sit}</p><p class="whisper">🔌 도덕 스위치 OFF · 아무도 보지 않음</p>
  <div id="area"></div></div>${FOOT}`;
  const area=document.getElementById('area');
  if(ans===-1){
    area.innerHTML=`<div class="choices">
      <button class="ch off" data-c="1"><span class="ic">😈</span><b>${sc.off.t}</b><span>+${sc.off.g} 코인</span></button>
      <button class="ch on" data-c="0"><span class="ic">😇</span><b>${sc.on.t}</b><span>코인 없음</span></button></div>`;
    area.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
      const c=+b.dataset.c, before=dayCoins();
      S.s1[i]=c; save();
      document.querySelector('.hud').outerHTML = hud(before, i);
      animateNum(document.getElementById('coin'), before, dayCoins());
      if(c===1){ const f=document.createElement('div'); f.className='float p'; f.textContent='+'+sc.off.g; document.getElementById('sc').appendChild(f); }
      showRes();
    });
  } else showRes();
  function showRes(){
    const c=S.s1[i];
    area.innerHTML=`<div class="result ${c===1?'r':'g'}"><b>${c===1?'😈 '+sc.off.t:'😇 '+sc.on.t}</b><p style="margin:6px 0 0">${c===1?sc.off.msg:sc.on.msg}</p></div>

    document.getElementById('nx').onclick=()=>{ if(i<4){ S.sc=i+1; go('scene'); } else go('news'); };

}

function titleOf(n){
  if(n===0) return ['🛡️','도덕 스위치 수호자','스위치가 꺼진 날에도 한 번도 흔들리지 않았어요. 아무도 보지 않을 때 지키는 사람이 진짜 강한 사람!'];
  if(n<=2) return ['🌱','흔들려도 돌아오는 사람','몇 번 흔들렸지만 대부분 지켜냈어요. 흔들린 장면을 떠올려 보는 게 성장의 시작이에요.'];
  if(n<=4) return ['🎢','스위치를 만지작거린 모험가','낮에는 코인이 쌓였지만 밤에 부메랑을 맞았죠. 오늘의 정산서가 무엇을 말해 주나요?'];
  return ['🌪️','도덕 OFF 챔피언 (그런데…)','낮의 코인은 최고! 하지만 모두가 같은 선택을 한 밤은 혼돈이었어요. 그 혼돈 속에서 가장 먼저 다친 사람은 누구였을까요?'];
}
function summaryText(){
  const L=['['+META.code+'] '+META.title,'이름: '+S.name,''];
  L.push('■ 하루의 선택');
  SCENES.forEach((s,i)=>L.push(' '+s.time+' '+s.place+': '+(S.s1[i]===1?'😈 '+s.off.t:'😇 '+s.on.t)));
  L.push(' 최종 코인: '+finalCoins()+' / 도덕은 누구를 위한 것? '+(WHO[S.who]||'-'));
  L.push('','■ 문장별 내 생각 (1~5)');
  ITEMS.forEach((t,i)=>L.push(' '+(i+1)+'. '+t+' → '+S.s2.v[i]+(SOLO?'':' (반 예측 '+S.s2.p[i]+'%)')));
  L.push('','■ 투명망토: '+(GYGES[S.s3.g]||'-'),'■ 나의 원칙: '+S.s3.rule,'');
  L.push('Q1. '+FQ[0],'A. '+S.fin.a,'','Q2. '+FQ[1],'A. '+S.fin.b);
  return L.join('\n');
}

function calcPct(){ const L=list().filter(s=>s.s2done); return {n:L.length, pct:ITEMS.map((_,i)=>L.length?Math.round(L.filter(s=>(arr(s.s2&&s.s2.v)[i]||0)>=4).length/L.length*100):0)}; }

        const avgP=Ld.length?Math.round(Ld.reduce((a,s)=>a+(arr(s.s2.p)[i]||0),0)/Ld.length):0;
        return `<div class="kpi" style="background:#fafbff"><b style="font-size:16px;color:var(--ink);font-family:'Noto Sans KR';font-weight:700">${i+1}. ${t}</b>
          <div class="dist" style="margin-top:22px">${cnt.map((n,k)=>`<div class="${k>=3?'hi':''}" style="height:${n/mx*100}%"><span>${n}</span></div>`).join('')}</div>
          <div class="dlab"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
          <p class="sm" style="margin:8px 0 0">실제 동의 <b>${c.pct[i]}%</b> · 반 평균 예측 <b>${avgP}%</b> ${Math.abs(avgP-c.pct[i])>=20?'<span style="color:var(--bad)">⚠️ 착각 큼</span>':''}</p></div>`;}).join('')}</div>
      <p class="mu sm">💡 발문: 예측과 실제가 가장 크게 어긋난 문장은? 우리는 왜 친구들이 그렇게 생각할 거라고 짐작했을까요?</p></div>
      <div class="card"><h3>🎯 마음 읽기 TOP 5</h3>${rank.length?rank.map((x,k)=>`<div class="hb"><span>${['🥇','🥈','🥉','4위','5위'][k]} ${T.anon?'익명 '+(k+1):nm(x.s)}</span><div class="tk"><i style="width:${x.sc}%;background:var(--gold)"></i></div><span class="v">${x.sc}점</span></div>`).join(''):'<p class="mu">아직 제출한 학생이 없어요.</p>'}
      <button class="btn ghost" id="an" style="margin-top:8px">${T.anon?'이름 보이기':'익명으로'}</button></div>`;
    document.getElementById('rv').onclick=()=>{ const cc=calcPct(); if(!cc.n){ toast('아직 제출한 학생이 없어요.'); return; } db.ref('moralday/'+T.room+'/meta').update({reveal:true, pct:cc.pct, n:cc.n}).then(()=>toast('학생 화면에 결과가 공개됐어요!')).catch(dbErr); };
    const hd=document.getElementById('hd'); if(hd) hd.onclick=()=>db.ref('moralday/'+T.room+'/meta').update({reveal:false}).catch(dbErr);
    document.getElementById('an').onclick=()=>{ T.anon=!T.anon; tRender(); };
    return;
  }
  if(T.tab==='s3'){
    const Lr=L.filter(s=>s.s3&&s.s3.rule);
    const gN=GYGES.map((_,k)=>L.filter(s=>s.s3&&s.s3.g===k).length), gT=gN.reduce((a,b)=>a+b,0);
    tb.innerHTML=`<div class="card"><h3>🧥 투명망토를 쓰고 가장 먼저 할 일</h3>
      ${GYGES.map((w,k)=>`<div class="hb"><span>${w}</span><div class="tk"><i style="width:${gT?gN[k]/gT*100:0}%;background:#8a5cf6"></i></div><span class="v">${gN[k]}명</span></div>`).join('')}
      <p class="mu sm">💡 발문: “아무도 모른다면”이라는 조건이 우리 선택을 바꾸었나요? 바꾸지 않은 친구들은 무엇 때문일까요?</p></div>
      <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">📌 우리 반 원칙 벽 (${Lr.length})</h2><button class="btn ghost" id="an">${T.anon?'이름 보이기':'익명으로'}</button></div>
      <div class="wall" style="margin-top:14px">${Lr.length?Lr.map((s,k)=>`<div class="note" style="background:${NOTE_COLORS[k%NOTE_COLORS.length]}">“${esc(s.s3.rule)}”<small>${T.anon?'':nm(s)}</small></div>`).join(''):'<p class="mu">아직 붙은 원칙이 없어요.</p>'}</div></div>`;
    document.getElementById('an').onclick=()=>{ T.anon=!T.anon; tRender(); };
    return;
  }
  if(T.tab==='fin'){
    const Lf=L.filter(s=>s.step==='done');
    tb.innerHTML=`<div class="card"><h2>📝 최종 제출물 (${Lf.length}명)</h2>
      ${Lf.length?Lf.sort((a,b)=>(a.name>b.name?1:-1)).map(s=>{ const o=arr(s.s1).filter(x=>x===1).length; const t=titleOf(o);
        return `<div class="sub"><b>${nm(s)}</b> <span class="badge">${t[0]} ${t[1]}</span> <span class="mu sm">OFF ${o}회</span>
        <p><b>Q1.</b> ${esc(s.fin&&s.fin.a)}</p><p><b>Q2.</b> ${esc(s.fin&&s.fin.b)}</p></div>`;}).join(''):'<p class="mu">아직 최종 제출한 학생이 없어요.</p>'}</div>`;
  }
}

function exportCSV(){
  const L=list(), c=calcPct();
  const head=['이름','캐릭터','진행','도덕OFF횟수',...SCENES.map(s=>s.time+' '+s.place),'도덕은 누구를 위해',...ITEMS.map((_,i)=>'문장'+(i+1)+' 응답'),...ITEMS.map((_,i)=>'문장'+(i+1)+' 예측%'),'예측점수','투명망토','나의 원칙','Q1','Q2'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=L.map(s=>{ const s1=arr(s.s1), v=arr(s.s2&&s.s2.v), p=arr(s.s2&&s.s2.p);
    return [s.name,s.emo,STEP_KO[s.step]||'',s1.filter(x=>x===1).length,...SCENES.map((_,i)=>s1[i]===1?'OFF':s1[i]===0?'ON':''),WHO[s.who]||'',...ITEMS.map((_,i)=>v[i]||''),...ITEMS.map((_,i)=>s.s2done?p[i]:''),s.s2done?predScore(p,c.pct):'',GYGES[s.s3&&s.s3.g]||'',s.s3&&s.s3.rule,s.fin&&s.fin.a,s.fin&&s.fin.b].map(q).join(','); });
  const blob=new Blob(['\ufeff'+[head.map(q).join(','),...rows].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='도덕이사라진하루_'+T.room+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- 시작 ---------- */
if(P.get('t')==='1') teacherHome();
else if(P.get('r')) studentStart(P.get('r').toUpperCase());
else home();
